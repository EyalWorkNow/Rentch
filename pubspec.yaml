name: dating_app
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.8+1435

environment:
  sdk: ^3.6.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^10.8.0
  provider: ^6.1.4
  flutter_card_swiper: ^7.2.0
  shared_preferences: ^2.5.3
  flutter_contacts: ^2.2.2
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  iconsax_plus: ^1.0.0
  flutter_svg: ^2.2.0
  url_launcher: ^6.3.1
  http: ^1.2.2
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  crypto: ^3.0.3
  # Ed25519 asymmetric signing for tamper-evident rental-contract signatures
  # (pure Dart, no native deps). Private keys stay on-device (secure storage).
  cryptography: ^2.7.0
  firebase_core: ^4.1.0
  firebase_auth: ^6.0.2
  firebase_messaging: ^16.0.0
  google_sign_in: ^7.1.1
  sign_in_with_apple: ^6.1.4
  flutter_secure_storage: ^9.2.4
  video_player: ^2.9.2
  # On-device transcode of iOS HEVC/.mov scans → H.264 mp4 (Teleport requires
  # mp4 for 3D reconstruction; HEVC uploads fail processing).
  video_compress: ^3.1.4
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  speech_to_text: ^7.4.0
  flutter_tts: ^4.2.5
  audioplayers: ^6.7.1
  # Gemini Live real-time voice: WebSocket + raw PCM mic capture + low-latency
  # PCM playback (Erik's hands-free real-time conversation).
  web_socket_channel: ^3.0.1
  record: ^5.2.1
  flutter_pcm_sound: ^3.1.6
  panorama_viewer: ^2.0.7
  webview_flutter: ^4.14.0
  # Persistent (disk) image cache so listing thumbnails load instantly after the
  # first fetch instead of re-downloading from external CDNs every time.
  cached_network_image: ^3.4.1
  camera: ^0.12.0+1
  image: ^4.3.0 # silent frame encode for the 360 sweep (YUV/BGRA → JPEG)
  sensors_plus: ^6.0.0 # gyro: capture a frame per N° of real rotation, not per timer
  # Scheduled LOCAL reminders for landlords (rent-due / lease-expiry). FCM already
  # handles server push but can't schedule on-device alarms; flutter_local_notifications
  # fires at an exact local time. `timezone` provides the Asia/Jerusalem tz the
  # plugin's zonedSchedule requires.
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  # Home-screen widget data bridge. We compute the user's activity summary
  # (matches / unread / likes) and write it under the keys w_matches, w_unread,
  # w_likes, w_updated. The native widgets (built by other agents, iOS App Group
  # group.com.eyalatiyawork.rentch) render these keys.
  home_widget: ^0.7.0
  # Deep links: open a shared apartment straight in the app (rently://property/:id
  # + universal/app links later). share_plus = native OS share sheet (opens
  # WhatsApp directly instead of the wa.me web page).
  app_links: ^6.3.2
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  remove_alpha_ios: true

dependency_overrides:
  device_info_plus: 11.3.0
  record_linux: 2.1.0
  record_platform_interface: 2.1.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  generate: true
  config:
    enable-swift-package-manager: false

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Liquid-glass orb for אתי's voice screen (refraction/dispersion/frost).
  shaders:
    - shaders/liquid_glass.frag

  # Typography: authentic SF Pro Rounded (Latin/digits) + authentic SF Hebrew
  # Rounded (Hebrew, variable-weight) → the whole UI is genuine SF Rounded.
  # Rubik kept as a final safety fallback.
  fonts:
    # SF Hebrew Rounded shipped as a single variable font (wght axis 1–1000),
    # which Flutter registered only at weight 400 — so every Hebrew w500–w900
    # rendered at 400 or as synthetic faux-bold, mismatched against the
    # per-weight Latin SF Pro Rounded faces. Fix: real static instances cut from
    # the variable font at each weight (fonttools instancer), so each weight is a
    # genuine face the OS renders correctly on every platform.
    - family: SF Hebrew Rounded
      fonts:
        - asset: assets/fonts/SF-Hebrew-Rounded-Light.ttf
          weight: 300
        - asset: assets/fonts/SF-Hebrew-Rounded-Regular.ttf
          weight: 400
        - asset: assets/fonts/SF-Hebrew-Rounded-Medium.ttf
          weight: 500
        - asset: assets/fonts/SF-Hebrew-Rounded-Semibold.ttf
          weight: 600
        - asset: assets/fonts/SF-Hebrew-Rounded-Bold.ttf
          weight: 700
        - asset: assets/fonts/SF-Hebrew-Rounded-Heavy.ttf
          weight: 800
        - asset: assets/fonts/SF-Hebrew-Rounded-Black.ttf
          weight: 900
    - family: SF Pro Rounded
      fonts:
        - asset: assets/fonts/SF-Pro-Rounded-Regular.otf
          weight: 400
        - asset: assets/fonts/SF-Pro-Rounded-Medium.otf
          weight: 500
        - asset: assets/fonts/SF-Pro-Rounded-Semibold.otf
          weight: 600
        - asset: assets/fonts/SF-Pro-Rounded-Bold.otf
          weight: 700
        - asset: assets/fonts/SF-Pro-Rounded-Heavy.otf
          weight: 800
        - asset: assets/fonts/SF-Pro-Rounded-Black.otf
          weight: 900
    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik-Light.ttf
          weight: 300
        - asset: assets/fonts/Rubik-Regular.ttf
          weight: 400
        - asset: assets/fonts/Rubik-Medium.ttf
          weight: 500
        - asset: assets/fonts/Rubik-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Rubik-Bold.ttf
          weight: 700
        - asset: assets/fonts/Rubik-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Rubik-Black.ttf
          weight: 900

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/demo/
    - assets/data/
    - assets/data/israel_cities.json
    - assets/data/israel_streets.json
    - assets/data/govdata/
    - assets/web/pannellum/
    - assets/web/psv/
    - assets/web/splat/
    - assets/web/scan3d/
    - assets/audio/erik/
    - assets/images/rently_logo.svg
    - assets/images/rently_logo_full.svg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
