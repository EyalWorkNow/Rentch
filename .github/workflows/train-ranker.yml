name: train-ranker

# Produces the Rently listing-ranker model.json (LightGBM dump_model format) and
# uploads it to S3, where the Node Lambda scorer (lib/model_scorer.mjs) picks it
# up via RANK_MODEL_S3. Cheap cron job — NO Fargate, NO serving service.
#
# SAFE TO EXIST UN-CONFIGURED: every step that needs a secret is guarded, so on a
# repo without the secrets set the job runs the offline selfcheck and then skips
# the pull/train/upload cleanly (green, no error). Wire the secrets below to arm.
#
# AUTH: we pull the training rows by INVOKING the router Lambda directly with a
# forged admin authorizer context (the same trick ml/activate.sh uses locally) —
# NOT a curl through API Gateway. This avoids a Firebase ID token, which expires
# in ~1h and can't back a daily cron. All auth is the assumed AWS OIDC role.
#
# Secrets/vars to set (Settings → Secrets and variables → Actions):
#   AWS_ROLE_ARN      — IAM role to assume via OIDC. Needs:
#                         lambda:InvokeFunction on the router  (pull the export)
#                         s3:PutObject on RANK_MODEL_BUCKET/KEY (upload the model)
#   AWS_REGION        — e.g. us-east-1
#   RANK_MODEL_BUCKET — S3 bucket for the artifact (the router's S3_BUCKET env)
#   RANK_MODEL_KEY    — S3 key, e.g. models/rank_model.json (MUST equal the
#                       scorer's RANK_MODEL_S3 key)
#   RANK_FN           — (optional) router function name; default rentch-router
#   RANK_ADMIN_UID    — (optional) notif-admin uid; default matches the Lambda

on:
  schedule:
    - cron: "17 4 * * *"   # daily 04:17 UTC — off-peak
  workflow_dispatch: {}     # manual "Run workflow" button

permissions:
  contents: read
  id-token: write           # for aws-actions OIDC role assumption

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r ml/requirements.txt

      - name: Offline selfcheck (always runs — proves the pipeline works)
        run: bash ml/selfcheck.sh

      # Gate all real work on the AWS role being configured. Referencing secrets
      # in `if:` is unreliable, so hoist presence into an output.
      - name: Check config
        id: cfg
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          RANK_MODEL_BUCKET: ${{ secrets.RANK_MODEL_BUCKET }}
          RANK_MODEL_KEY: ${{ secrets.RANK_MODEL_KEY }}
        run: |
          if [ -n "$AWS_ROLE_ARN" ] && [ -n "$RANK_MODEL_BUCKET" ] && [ -n "$RANK_MODEL_KEY" ]; then
            echo "armed=true" >> "$GITHUB_OUTPUT"
          else
            echo "AWS_ROLE_ARN / RANK_MODEL_BUCKET / RANK_MODEL_KEY not all set — dormant (selfcheck only)."
            echo "armed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials (OIDC)
        if: steps.cfg.outputs.armed == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # ── Pull the real labeled rows by invoking GET /ml/export on the router,
      # forging the admin authorizer context (uid). Writes rows.json. ──────────
      - name: Pull training export (lambda invoke)
        id: pull
        if: steps.cfg.outputs.armed == 'true'
        env:
          RANK_FN: ${{ secrets.RANK_FN }}
          RANK_ADMIN_UID: ${{ secrets.RANK_ADMIN_UID }}
        run: |
          FN="${RANK_FN:-rentch-router}"
          # Resolve the admin uid from the Lambda's own env (fallback to default).
          UID_ENV="$(aws lambda get-function-configuration --function-name "$FN" \
            --query 'Environment.Variables.NOTIF_ADMIN_UID' --output text 2>/dev/null || true)"
          ADMIN="${RANK_ADMIN_UID:-}"
          [ -z "$ADMIN" ] && ADMIN="$UID_ENV"
          { [ -z "$ADMIN" ] || [ "$ADMIN" = "None" ]; } && ADMIN='dR46Nv6L3mN1cyzXwxrubHpdqZi2'
          printf '{"httpMethod":"GET","path":"/ml/export","requestContext":{"authorizer":{"uid":"%s"}}}' "$ADMIN" > evt.json
          aws lambda invoke --function-name "$FN" --payload fileb://evt.json out.json >/dev/null
          python -c "import json;b=json.loads(json.load(open('out.json'))['body']);r=b.get('rows',[]);open('rows.json','w').write(json.dumps(r));print('rows:',len(r))"
          echo "have_data=true" >> "$GITHUB_OUTPUT"

      # ── Train. The cold-start guard inside train.py decides whether a model is
      # actually emitted (< 200 rows or a single class → no file, no upload). ───
      - name: Train
        if: steps.pull.outputs.have_data == 'true'
        run: |
          python ml/train.py --input rows.json --output model.json \
            --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Upload model.json to S3
        if: steps.pull.outputs.have_data == 'true'
        env:
          RANK_MODEL_BUCKET: ${{ secrets.RANK_MODEL_BUCKET }}
          RANK_MODEL_KEY: ${{ secrets.RANK_MODEL_KEY }}
        run: |
          if [ ! -s model.json ]; then
            echo "No model.json (cold-start guard tripped: < 200 rows or one class) — nothing to upload."
            exit 0
          fi
          aws s3 cp model.json "s3://$RANK_MODEL_BUCKET/$RANK_MODEL_KEY"
          aws s3 cp model.json.meta.json "s3://$RANK_MODEL_BUCKET/${RANK_MODEL_KEY%.json}.meta.json" || true
          echo "Uploaded → s3://$RANK_MODEL_BUCKET/$RANK_MODEL_KEY"
          echo "NOTE: set the Lambda env RANK_MODEL_S3=$RANK_MODEL_BUCKET/$RANK_MODEL_KEY once (ml/activate.sh or console) so the scorer serves it."
