<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>סריקה תלת-מימדית</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  model-viewer{position:absolute;inset:0;width:100%;height:100%;
    background:#000;--poster-color:transparent}
  #loading{position:absolute;inset:0;display:flex;align-items:center;
    justify-content:center;color:#fff;font:600 15px sans-serif;text-align:center;
    padding:32px;background:#000}
  #err{position:absolute;inset:0;display:none;align-items:center;
    justify-content:center;color:#fff;font:600 15px sans-serif;
    padding:32px;text-align:center;background:#000}
  .bar{position:absolute;left:24px;right:24px;bottom:36px;height:6px;
    background:rgba(255,255,255,.18);border-radius:999px;overflow:hidden;
    display:none}
  .bar>i{display:block;height:100%;width:0;background:#00A6A6;
    border-radius:999px;transition:width .15s ease}
</style>
<!-- Google <model-viewer> (BSD-3) — a single self-contained bundle (its own
     three.js + GLTFLoader + OrbitControls). Vendored locally and served by the
     on-device HTTP server, so nothing is fetched from the network for the
     viewer code itself; only the GLB asset itself streams over the network. -->
<script type="module" src="/model-viewer.min.js"></script>
</head>
<body>
<div id="loading">טוען מודל תלת-מימדי…</div>
<div id="err"></div>
<div class="bar" id="bar"><i id="barFill"></i></div>

<script type="module">
  const cfg = window.RENTLY_SCAN3D || { meshGlbUrl: '' };
  const loadEl = document.getElementById('loading');
  const errEl  = document.getElementById('err');
  const bar    = document.getElementById('bar');
  const barFill= document.getElementById('barFill');

  function fail(msg) {
    if (loadEl) loadEl.style.display = 'none';
    if (bar) bar.style.display = 'none';
    errEl.style.display = 'flex';
    errEl.textContent = 'לא ניתן לטעון את המודל: ' + (msg || '');
  }

  try {
    if (!cfg.meshGlbUrl) throw new Error('no model url');

    const mv = document.createElement('model-viewer');
    mv.setAttribute('src', cfg.meshGlbUrl);
    mv.setAttribute('camera-controls', '');     // orbit / pan / zoom
    mv.setAttribute('touch-action', 'pan-y');
    mv.setAttribute('interaction-prompt', 'none');
    mv.setAttribute('shadow-intensity', '1');
    mv.setAttribute('exposure', '1');
    mv.setAttribute('min-field-of-view', '10deg');
    mv.setAttribute('max-field-of-view', '90deg');
    mv.setAttribute('loading', 'eager');
    mv.setAttribute('reveal', 'auto');
    document.body.appendChild(mv);

    bar.style.display = 'block';
    mv.addEventListener('progress', (e) => {
      const p = Math.round((e.detail.totalProgress || 0) * 100);
      barFill.style.width = p + '%';
    });
    mv.addEventListener('load', () => {
      if (loadEl) loadEl.style.display = 'none';
      bar.style.display = 'none';
    });
    mv.addEventListener('error', (e) => {
      const t = (e.detail && e.detail.type) ? e.detail.type : 'loadfailure';
      fail(t);
    });
  } catch (e) {
    fail(String(e && e.message ? e.message : e));
  }
</script>
</body>
</html>
